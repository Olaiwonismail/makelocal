[project]
name = "makelocal-backend"
version = "0.1.0"
description = "MakeLocal agent pipeline: product -> analysis -> cost -> suppliers -> plan -> quotes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "google-genai>=1.0",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
